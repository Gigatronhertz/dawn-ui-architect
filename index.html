  <script>
    // Apply the theme before first paint. Dark is the default, so add the class
    // unless the user explicitly chose light. Matches storageKey in App.tsx.
    try {
      if (localStorage.getItem("karije-theme") !== "light")
        document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
