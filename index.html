<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Karije plans your group trip in minutes. AI itinerary, hotel suggestions, Paystack split payments, and automatic email follow-ups — all in one link. Lagos · Accra · Abuja · Dakar.">
    <meta name="author" content="Karije" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png">
    <meta property="og:title" content="Karije — Group trips, planned in minutes">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png">

    <meta name="twitter:description" content="Plan your group trip in minutes. AI itinerary, Paystack split payments, and automatic email follow-ups — all in one link.">
    <!-- Tab icon — the Karije plane mark, signal yellow on ink. The SVG is
         what modern browsers use and stays sharp at any size; the PNG and the
         .ico are there for the ones that ask for a raster. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Apply the theme before first paint. Dark is the default, so add the class
    // unless the user explicitly chose light. Matches storageKey in App.tsx.
    try {
      if (localStorage.getItem("karije-theme") !== "light")
        document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
