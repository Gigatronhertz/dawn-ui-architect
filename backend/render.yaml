services:
  - type: web
    name: mysquadgo-backend
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/.puppeteer-cache

      # ── Database (Turso) ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # ── Admin panel (/admin) ───────────────────────────────────────────────
      # Required in production. The dev fallback in adminRoutes.js is public,
      # so it is refused when NODE_ENV=production — if this is unset the admin
      # panel returns 401 for every request rather than accepting a known key.
      # Paste the value into the Render dashboard; never commit it.
      - key: ADMIN_KEY
        sync: false

      # ── AI plan generation (Groq) ──────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false

      # ── Web Push (VAPID) ───────────────────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        value: BPxF52XvvGuQWWYzJCYwDXY6VnH2A6euA1hnWHjWUu7CvgUDZRZ19k5xrbt9XuUFbjHjtQ4JJG3AgBRrilQxtW4
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: hello@mysquadgo.com

      # ── Email notifications (Resend) ───────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "MySquadGo <onboarding@resend.dev>"
      - key: FRONTEND_URL
        value: https://mysquadgo.vercel.app

      # ── Firebase Admin (Google Auth verification) ──────────────────────────
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # ── WhatsApp (Meta Cloud API) ──────────────────────────────────────────
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_DISPLAY_NUMBER
        sync: false

      # ── Payments (Paystack) ────────────────────────────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # ── Scrapers ───────────────────────────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false

      # ── CORS ───────────────────────────────────────────────────────────────
      - key: FRONTEND_ORIGIN
        value: "https://mysquadgo.vercel.app"
